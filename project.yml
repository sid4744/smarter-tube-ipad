name: SmarterTV
options:
  bundleIdPrefix: app.smarter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmarterTV:
    type: application
    platform: iOS
    sources:
      - App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smarter.tv
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
